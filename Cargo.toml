[workspace]
members = ["crates/resolibre-core", "crates/resolibre-audio", "crates/resolibre-storage", "apps/desktop"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "GPL-3.0-only"
version = "0.1.0"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"

# Keep interactive DSP usable in the development player without optimizing away adapter/UI debugging.
[profile.dev.package.resolibre-core]
opt-level = 3

[profile.dev.package.rustfft]
opt-level = 3

# Unoptimized hashing can exhaust the cache identity deadline on ordinary song-sized files.
[profile.dev.package.sha2]
opt-level = 3

# CPU inference must also remain usable in the development player.
[profile.dev.package.lossprint]
opt-level = 3
[profile.dev.package.tract-core]
opt-level = 3
[profile.dev.package.tract-linalg]
opt-level = 3
[profile.dev.package.tract-data]
opt-level = 3

# Optimize local production builds while retaining Rust's normal panic recovery behavior.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "debuginfo"
