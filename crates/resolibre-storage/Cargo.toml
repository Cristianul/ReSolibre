[package]
name = "resolibre-storage"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
resolibre-core = { path = "../resolibre-core" }
rusqlite = { version = "=0.40.2", features = ["bundled", "limits"] }
sha2 = "=0.11.1"
symphonia = { version = "=0.6.1", default-features = false, features = ["all-formats", "all-meta", "flac", "mp3", "aac"] }
serde_json = { version = "=1.0.154", features = ["float_roundtrip"] }

[lints]
workspace = true
