# No hardware discovery, session manager, DBus, TCP or desktop configuration.
context.properties = {
    core.daemon = true
    core.name = resolibre-test
    support.dbus = false
    loop.rt-prio = 0
}
context.spa-libs = {
    audio.convert.* = audioconvert/libspa-audioconvert
    support.* = support/libspa-support
}
context.modules = [
    { name = libpipewire-module-protocol-native }
    { name = libpipewire-module-metadata }
    { name = libpipewire-module-spa-node-factory }
    { name = libpipewire-module-client-node }
    { name = libpipewire-module-adapter }
    { name = libpipewire-module-link-factory }
    { name = libpipewire-module-access
      args = { access.socket = { resolibre-test = unrestricted } } }
]
context.objects = [
    { factory = spa-node-factory
      args = { factory.name = support.node.driver
               node.name = Dummy-Driver priority.driver = 200000 } }
    { factory = adapter
      args = {
          factory.name = support.null-audio-sink
          node.name = resolibre-test
          media.class = Audio/Sink
          audio.position = [ FL FR ]
          adapter.auto-port-config = { mode = dsp monitor = true position = preserve }
      } }
]
