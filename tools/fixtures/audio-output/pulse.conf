# Private test endpoint only; PULSE_RUNTIME_PATH selects the owned directory.
context.properties = { support.dbus = false loop.rt-prio = 0 }
context.spa-libs = {
    audio.convert.* = audioconvert/libspa-audioconvert
    support.* = support/libspa-support
}
context.modules = [
    { name = libpipewire-module-protocol-native }
    { name = libpipewire-module-client-node }
    { name = libpipewire-module-adapter }
    { name = libpipewire-module-metadata }
    { name = libpipewire-module-protocol-pulse }
]
pulse.properties = {
    server.address = [ "unix:native" ]
    pulse.allow-module-loading = false
}
# Expose ports without a session manager. The harness links them explicitly.
stream.properties = {
    adapter.auto-port-config = { mode = dsp position = preserve }
}
